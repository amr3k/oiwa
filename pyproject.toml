[project]
name = "oiwa"
version = "0.3.1"
description = "A simple Telegram bot that converts a phone number to a direct WhatsApp chat link"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
authors = [{ name = "Amr", email = "contact@a3k.me" }]

dependencies = [
    "python-telegram-bot>=22.7",
    "python-dotenv>=1.2.2",
    "phonenumbers>=9.0.16",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
